<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Adams · McKeldin Family Tree</title>
<meta name="description" content="An interactive family history for the Adams, McKeldin and related families." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/app.css" />
</head>
<body>
<div id="app">
  <header id="hdr">
    <button class="icon-btn" id="btn-dir" title="People" aria-label="Open the people list">☰</button>
    <div class="brand">Adams · McKeldin <span>Family Tree</span></div>
    <div class="search">
      <input id="search" type="search" placeholder="Search people…  ( / )" autocomplete="off" aria-label="Search people" />
      <div class="dropdown" id="search-results"></div>
    </div>
    <div class="spacer"></div>
    <button class="hbtn" id="btn-home" title="Start page">⌂ <span class="label">Start</span></button>
    <button class="hbtn" id="btn-fit" title="Fit the tree in view">⤢ <span class="label">Fit</span></button>
    <button class="hbtn" id="btn-panel" title="Show or hide details">☰ <span class="label">Details</span></button>
  </header>

  <div id="main">
    <aside id="dir" aria-label="People"></aside>

    <div id="canvas">
      <svg id="svg" class="hidden" role="img" aria-label="Family tree around the selected person">
        <defs></defs>
      </svg>
      <div class="legend">
        <span><i></i>parent → child</span>
        <span><i class="dashed"></i>half sibling</span>
      </div>
      <div class="zoom-ctl">
        <button id="zoom-in" aria-label="Zoom in">+</button>
        <button id="zoom-out" aria-label="Zoom out">−</button>
      </div>
      <div id="landing"></div>
    </div>

    <aside id="panel" aria-label="Details"></aside>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
