<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Adams · McKeldin Family Tree</title>
<meta name="description" content="An interactive family history for the Adams, McKeldin and related families." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/app.css?v=eb3ecf7c" data-versioned />
</head>
<body>
<div id="app">
  <header id="hdr">
    <button class="icon-btn" id="btn-dir" title="People" aria-label="Open the people list">☰</button>
    <div class="brand">Adams · McKeldin <span>Family Tree</span></div>
    <div class="search">
      <input id="search" type="search" placeholder="Search people…  ( / )" autocomplete="off" aria-label="Search people" />
      <div class="dropdown" id="search-results"></div>
    </div>
    <form class="ask-box" id="ask-form" role="search" aria-label="Ask a question">
      <input id="ask" type="search" placeholder="Ask a question…" autocomplete="off" aria-label="Ask a question about the family" />
    </form>
    <button class="hbtn" id="btn-ask" title="Ask a question">✦ <span class="label">Ask</span></button>
    <div class="spacer"></div>
    <button class="hbtn" id="btn-home" title="Start page">⌂ <span class="label">Start</span></button>
    <button class="hbtn" id="btn-fit" title="Fit the tree in view">⤢ <span class="label">Fit</span></button>
    <button class="hbtn" id="btn-panel" title="Show or hide details">☰ <span class="label">Details</span></button>
  </header>

  <div id="main">
    <aside id="dir" aria-label="People"></aside>

    <div id="canvas">
      <svg id="svg" class="hidden" role="img" aria-label="Family tree around the selected person">
        <defs></defs>
      </svg>
      <div class="view-bar" id="view-bar" hidden>
        <div class="seg" role="tablist" aria-label="Chart type">
          <button role="tab" data-view="family" id="tab-family">Family</button>
          <button role="tab" data-view="ancestors" id="tab-ancestors">Ancestors</button>
          <button role="tab" data-view="descendants" id="tab-descendants">Descendants</button>
        </div>
        <div class="gen-ctl" id="gen-ctl" hidden>
          <span class="gen-label">Generations</span>
          <button id="gen-less" aria-label="Fewer generations">−</button>
          <span id="gen-count">4</span>
          <button id="gen-more" aria-label="More generations">+</button>
          <button id="gen-all" class="text">All <span id="gen-max"></span></button>
          <button id="btn-print" class="text" title="Print this chart">Print</button>
        </div>
      </div>
      <div class="print-title" id="print-title"></div>
      <div class="legend">
        <span><i></i>parent → child</span>
        <span><i class="dashed"></i>half sibling</span>
        <span><b class="dot"></b>living</span>
        <span><b class="dot assumed"></b>living (assumed)</span>
      </div>
      <div class="zoom-ctl">
        <button id="zoom-in" aria-label="Zoom in">+</button>
        <button id="zoom-out" aria-label="Zoom out">−</button>
      </div>
      <div id="landing"></div>
    </div>

    <aside id="panel" aria-label="Details"></aside>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<!-- versions:start (written by scripts/build.js; each file gets ?v=<content hash> so browsers fetch changes immediately) -->
<script type="importmap">{
 "imports": {
  "./js/app.js": "./js/app.js?v=1931ff1a",
  "./js/ask.js": "./js/ask.js?v=f71cab7f",
  "./js/config.js": "./js/config.js?v=ccfc531b",
  "./js/data.js": "./js/data.js?v=eaab13e0",
  "./js/descendants.js": "./js/descendants.js?v=bef0ca3f",
  "./js/layout.js": "./js/layout.js?v=143a2a06",
  "./js/panel.js": "./js/panel.js?v=3b93d213",
  "./js/pedigree.js": "./js/pedigree.js?v=e58071a9",
  "./js/relate.js": "./js/relate.js?v=44f04645",
  "./js/render.js": "./js/render.js?v=11428dd8",
  "./js/sidebar.js": "./js/sidebar.js?v=1f9233ba",
  "./js/suggest.js": "./js/suggest.js?v=98999ba9",
  "./js/viewer.js": "./js/viewer.js?v=2853f923"
 }
}</script>
<!-- versions:end -->
<script type="module" src="js/app.js?v=1931ff1a" data-versioned></script>
</body>
</html>
